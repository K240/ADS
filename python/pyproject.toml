[project]
name = "ads-api"
version = "0.1.0"
description = "Python API for ADS asset versioning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser = ["PySide6>=6.6"]

[project.scripts]
ads-deps = "ads.usd_deps:main"
ads-browser = "ads_browser.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ads_browser = ["qml/*.qml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

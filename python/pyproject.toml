[project]
name = "ads-api"
version = "0.1.0"
description = "Python API for ADS asset versioning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ads-deps = "ads.usd_deps:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
